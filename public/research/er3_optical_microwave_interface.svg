<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Er3+:YSO optical-microwave interface methods</title>
<desc id="desc">Conceptual device and methods schematic showing an optical mode coupled through a grating and photonic interface to an Er3+:YSO ion, with microwave and coplanar-waveguide control as a second interface. The lower row connects electromagnetic design and simulation, fabrication and SEM inspection. Geometry is illustrative and not to scale; no experimental parameters are given.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#1A1A1A"/></marker>
  <marker id="blue-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#6A6A68"/></marker>
  <radialGradient id="mode"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".37" stop-color="#FFFFFF"/><stop offset=".57" stop-color="#4A4A48"/><stop offset=".74" stop-color="#ECECEA"/><stop offset="1" stop-color="#FFFFFF"/></radialGradient>
  <linearGradient id="host" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F0F0EE"/><stop offset="1" stop-color="#E2E2E0"/></linearGradient>
</defs>
