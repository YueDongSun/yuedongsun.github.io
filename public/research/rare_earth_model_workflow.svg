<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Rare-earth memory modelling hierarchy</title>
<desc id="desc">Qualitative method diagram linking the rare-earth crystal environment to free-ion, crystal-field, Zeeman and hyperfine Hamiltonian terms, an effective low-energy spin model, then transition, ZEFOZ and memory-protocol comparisons. No experimental or simulated energy spectrum is reproduced.</desc>
